plugins {
    id 'com.android.application'
}
android {
    namespace 'com.browserplus.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.browserplus.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
}
